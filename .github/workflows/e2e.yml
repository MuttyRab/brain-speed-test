name: End-to-end battery test

on:
  push:
    branches:
      - main
      - fix/pro-grade-redesign
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Node runtime
        run: node --version && npm --version
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Desktop full battery
        run: npm run test:e2e -- --project=desktop-chromium --reporter=line
      - name: Mobile Safari full battery
        run: npm run test:e2e -- --project=mobile-safari-size --reporter=line
