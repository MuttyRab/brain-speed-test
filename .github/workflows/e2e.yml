name: End-to-end battery test

on:
  push:
    branches:
      - main
      - fix/pro-grade-redesign
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Node runtime
        run: node --version && npm --version
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Desktop full battery
        run: npm run test:e2e -- --project=desktop-chromium --reporter=line
      - name: Mobile Safari full battery
        continue-on-error: true
        run: |
          set +e
          npm run test:e2e -- --project=mobile-safari-size --reporter=line > mobile-test.log 2>&1
          echo $? > mobile-exit.txt
          cat mobile-test.log
      - name: Upload mobile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-diagnostics
          path: |
            mobile-test.log
            mobile-exit.txt
            test-results
          if-no-files-found: ignore
      - name: Enforce mobile pass
        run: test "$(cat mobile-exit.txt)" = "0"
