<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<title>Brain Speed Test</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#070a0f;color:#f4f1e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}.boot{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,rgba(111,140,255,.14),transparent 35rem),#070a0f}.boot-inner{display:flex;flex-direction:column;align-items:center;gap:16px}.boot-mark{width:52px;height:52px;border:1px solid #35445a;border-top-color:#c9ff46;border-radius:50%;animation:spin .85s linear infinite;box-shadow:0 0 0 9px rgba(201,255,70,.025)}.boot-label{font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;color:#98a5b5;text-transform:uppercase}@keyframes spin{to{transform:rotate(360deg)}}.error{max-width:420px;padding:28px;text-align:center;line-height:1.6}.error b{display:block;margin-bottom:8px;color:#c9ff46}.error button{margin-top:16px;padding:12px 18px;border:1px solid #c9ff46;border-radius:10px;background:#c9ff46;color:#11150a;font-weight:750;cursor:pointer}@media(prefers-reduced-motion:reduce){.boot-mark{animation-duration:2s}}
</style>
</head>
<body>
<div class="boot" id="boot"><div class="boot-inner"><div class="boot-mark"></div><div class="boot-label">Calibrating assessment</div></div></div>
<script>
(function(){
  var ORIGINAL='https://raw.githubusercontent.com/MuttyRab/brain-speed-test/b5cc2acab5627aacf041ee4f5508709f2b940df9/index.html';
  var STYLES=['redesign-1.css','redesign-2.css','redesign-3.css'];
  function get(url){return fetch(url,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('Request failed: '+r.status);return r.text();});}
  Promise.all([get(ORIGINAL)].concat(STYLES.map(get))).then(function(parts){
    var source=parts.shift();
    var css=parts.join('\n');
    source=source.replace('<meta name="theme-color" content="#0a0a0a">','<meta name="theme-color" content="#070a0f">');
    source=source.replace('</head>','<style id="instrument-visual-overhaul">'+css+'</style></head>');
    var frame=document.createElement('iframe');
    frame.title='Brain Speed Test cognitive assessment';
    frame.setAttribute('allow','clipboard-write');
    frame.style.cssText='position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;background:#070a0f;display:block';
    frame.onload=function(){var boot=document.getElementById('boot');if(boot)boot.remove();};
    frame.srcdoc=source;
    document.body.appendChild(frame);
  }).catch(function(err){
    var boot=document.getElementById('boot');
    boot.innerHTML='<div class="error"><b>Assessment could not load.</b>Check your connection and try again.<br><button onclick="location.reload()">Retry</button></div>';
    console.error(err);
  });
})();
</script>
</body>
</html>
