<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Speed Test</title>

<style>

body{
font-family: Arial, sans-serif;
background: linear-gradient(135deg,#0f1724,#081226);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:rgba(255,255,255,0.06);
padding:40px;
border-radius:15px;
text-align:center;
width:420px;
box-shadow:0 20px 50px rgba(0,0,0,0.5);
}

h1{
margin-top:0;
}

button{
padding:12px 20px;
font-size:16px;
border:none;
border-radius:8px;
background:#7bd389;
cursor:pointer;
font-weight:bold;
}

#stimulus{
margin-top:25px;
height:150px;
display:flex;
align-items:center;
justify-content:center;
}

.circle{
width:100px;
height:100px;
background:white;
border-radius:50%;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<h1>How Fast Is Your Brain?</h1>

<p>Click the circle as fast as you can when it appears.</p>

<button onclick="startTest()">Start Test</button>

<div id="stimulus"></div>

<div class="result" id="result"></div>

</div>

<script>

let startTime
let trials = 5
let currentTrial = 0
let results = []

function startTest(){

results = []
currentTrial = 0
document.getElementById("result").innerText=""

nextTrial()

}

function nextTrial(){

document.getElementById("stimulus").innerHTML="Wait..."

let delay = 1000 + Math.random()*3000

setTimeout(()=>{

document.getElementById("stimulus").innerHTML=
'<div class="circle" onclick="recordReaction()"></div>'

startTime = performance.now()

},delay)

}

function recordReaction(){

let reaction = performance.now() - startTime

results.push(reaction)

currentTrial++

if(currentTrial < trials){

nextTrial()

}

else{

showResults()

}

}

function showResults(){

let avg = results.reduce((a,b)=>a+b)/results.length

avg = Math.round(avg)

let message = evaluateScore(avg)

document.getElementById("stimulus").innerHTML=""

document.getElementById("result").innerText =
"Average Reaction Time: "+avg+" ms\n\n"+message

}

function evaluateScore(ms){

if(ms < 200){
return "Extremely fast. Your reaction speed is faster than most people."
}

else if(ms < 250){
return "Above average reaction speed."
}

else if(ms < 300){
return "Average reaction speed."
}

else if(ms < 350){
return "Below average reaction speed."
}

else{
return "Slower than average reaction speed."
}

}

</script>

</body>
</html>
